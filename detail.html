<body class="dewford-subpage">

    <main id="main-content" class="dewford-subpage-content dewford-detail-page" aria-label="Events" data-page-intro="false">
<section class="blog-details pt-100 pb-100" data-news-detail="">
<div class="container">
<div class="row">
<div class="col-xl-8 col-lg-7">
<div class="blog-details__left">
<div class="blog-details__img" data-detail-image=""><div class="blog-details__date" data-detail-date="" hidden=""><span class="day"></span><span class="month"></span></div></div>

<div class="blog-details__text-2" data-detail-body=""></div>


</div>
<div class="nav-links" data-detail-neighbors=""></div>

</div>
</div>
<div class="col-xl-4 col-lg-5">

<div class="sidebar__single sidebar__search">
<form action="event.html" class="sidebar__search-form" method="get">
<input aria-label="소식 검색" name="q" placeholder="소식 검색" type="search"/>
<button aria-label="검색" type="submit"><i class="lnr-icon-search"></i></button>
</form>
</div>
<div class="sidebar__single sidebar__post">
<h3 class="sidebar__title"><i class="fas fa-newspaper" aria-hidden="true"></i> 최근 소식</h3>
<ul class="sidebar__post-list list-unstyled" data-detail-related=""></ul>
</div>


</div>
</div>
</div>
