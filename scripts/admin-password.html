<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEWFORD 관리자 비밀번호 설정</title>
<style>@font-face{font-family:Pretendard;src:url('../fonts/pretendard/PretendardVariable.woff2')}*{box-sizing:border-box}body{margin:0;padding:48px 20px;background:#f5f5f5;color:#222;font:15px/1.7 Pretendard,sans-serif}main{max-width:580px;margin:auto;padding:32px;background:white;border-top:4px solid #52196d}h1{font-size:25px;margin:0 0 16px}p{color:#756b7a}label{display:block;font-weight:600;margin-top:24px}input,textarea{width:100%;padding:12px;border:1px solid #ddd;margin-top:8px;font:inherit}textarea{font:13px/1.7 monospace;resize:vertical;overflow-wrap:anywhere}button{padding:12px 20px;border:0;background:#52196d;color:#fff;font:inherit;cursor:pointer;margin-top:16px}button:disabled{opacity:.5}#status{color:#52196d}[hidden]{display:none}</style></head>
<body><main><h1>관리자 비밀번호 해시 생성</h1><p>원하는 비밀번호를 입력하세요. 이 도구는 브라우저 안에서만 작동하며, 비밀번호를 서버로 전송하거나 저장하지 않습니다.</p>
<form id="form"><label for="password">로그인에 사용할 비밀번호</label><input id="password" type="password" autocomplete="new-password" minlength="12" required placeholder="12자 이상"><button type="submit">해시 생성</button></form>
<div id="result" hidden><label for="hash">ADMIN_PASSWORD_HASH에 등록할 값</label><textarea id="hash" readonly rows="5" spellcheck="false"></textarea><p>위 값 전체를 Cloudflare의 <strong>ADMIN_PASSWORD_HASH</strong> Secret에 붙여넣고 저장·배포하세요. 로그인할 때는 입력했던 원래 비밀번호를 사용합니다.</p></div><p id="status" role="status" aria-live="polite"></p>
</main><script>
const form=document.getElementById('form'),password=document.getElementById('password'),status=document.getElementById('status');
const hex=bytes=>Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
form.addEventListener('submit',async event=>{
 event.preventDefault();if(!form.reportValidity())return;
 const button=form.querySelector('button');button.disabled=true;status.textContent='해시를 생성하고 있습니다.';
 try{
  const encode=new TextEncoder(),salt=hex(crypto.getRandomValues(new Uint8Array(16)));
  const key=await crypto.subtle.importKey('raw',encode.encode(password.value),'PBKDF2',false,['deriveBits']);
  const hash=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:encode.encode(salt),iterations:100000},key,256));
  document.getElementById('hash').value='pbkdf2$100000$'+salt+'$'+hex(hash);
  document.getElementById('result').hidden=false;password.value='';status.textContent='생성했습니다. 해시 전체를 복사하세요.';
 }catch{status.textContent='생성하지 못했습니다. Chrome 또는 Safari에서 이 HTML 파일을 직접 열어 주세요.';}
 finally{button.disabled=false;}
});
</script></body></html>
