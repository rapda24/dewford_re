<section class="contact-details">
    <div class="container pt-110 pb-70">

            <h2>입학·교육 상담 신청</h2>

          <form id="contact_form" name="contact_form" action="includes/sendmail.php" method="post">
            <div class="row">
              <div class="col-sm-6">
                <div class="mb-3">
                  <input name="form_name" class="form-control" type="text" placeholder="학부모 성함" aria-label="학부모 성함">
                </div>
              </div>
              <div class="col-sm-6">
                <div class="mb-3">
                  <input name="form_email" class="form-control required email" type="email" placeholder="이메일 주소" aria-label="이메일 주소">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-sm-6">
                <div class="mb-3">
                  <input name="form_subject" class="form-control required" type="text" placeholder="상담 제목 또는 관심 교육 과정" aria-label="상담 제목 또는 관심 교육 과정">
                </div>
              </div>
              <div class="col-sm-6">
                <div class="mb-3">
                  <input name="form_phone" class="form-control" type="text" placeholder="연락처" aria-label="연락처">
                </div>
              </div>
            </div>
            <div class="mb-3">
              <textarea name="form_message" class="form-control required" rows="7" placeholder="아이의 연령, 현재 영어 학습 경험과 궁금하신 내용을 남겨주세요." aria-label="상담 내용"></textarea>
            </div>
            <div class="mb-5">
              <input name="form_botcheck" class="form-control" type="hidden" value="" />
              <button type="submit" class="theme-btn btn-style-one" data-loading-text="접수 중입니다..."><span class="btn-title">상담 신청하기</span></button>
              <button type="reset" class="theme-btn btn-style-one"><span class="btn-title">다시 작성</span></button>
            </div>
          </form>
          <!-- Contact Form Validation-->
        </div>
        <div class="col-xl-5 col-lg-6">

            </div>
            <ul class="list-unstyled contact-details__info">

              </li>
              <li>

                </div>
              </li>
              <li>
