<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DEWFORD 관리자</title><link rel="icon" href="images/common/symbol_3.png"><link rel="stylesheet" href="css/dewford-shared-ui.css"><link rel="stylesheet" href="css/vendor/quill.snow.css"><link rel="stylesheet" href="css/dewford-admin.css"></head>
<body class="dewford-admin-page">
<p id="admin-auth-loading" role="status">관리 화면을 불러오고 있습니다.</p>
<section id="admin-workspace" class="admin-workspace" hidden>
  <aside class="admin-sidebar">
    <a class="admin-brand" href="admin.html"><img src="images/dewford/logo-sharp-white.svg" alt="DEWFORD INTERNATIONAL COLLEGE" width="316" height="75"></a>
    <p class="admin-nav-label">WORKSPACE</p>
    <nav class="admin-tabs" aria-label="관리할 게시판">
      <button data-board="events"><span>이벤트 게시판</span><span aria-hidden="true">↗</span></button>
      <button data-board="preschool"><span>유치부 캘린더</span><span aria-hidden="true">↗</span></button>
      <button data-board="elementary"><span>초등부 캘린더</span><span aria-hidden="true">↗</span></button>
      <button data-board="popups"><span>팝업 관리</span><span aria-hidden="true">↗</span></button>
      <a class="admin-inquiries-link" href="admin-inquiries.html"><span>상담 접수</span><span aria-hidden="true">↗</span></a>
      <a class="admin-inquiries-link" href="admin-tuition.html"><span>교습비 관리</span><span aria-hidden="true">↗</span></a>
      <a class="admin-inquiries-link" href="admin-settings.html"><span>공통 정보 관리</span><span aria-hidden="true">↗</span></a>
      <a class="admin-inquiries-link" href="admin-guide.html" target="_blank" rel="noopener noreferrer"><span>운영 가이드</span><span aria-hidden="true">↗</span></a>
    </nav>
    <div class="admin-sidebar-bottom"><a href="index.html">홈페이지 보기 ↗</a><button id="admin-logout" type="button">로그아웃</button></div>
  </aside>
  <main class="admin-main">
    <header class="admin-topbar"><span>DEWFORD / ADMIN</span><span>홈페이지 관리</span></header>
    <div class="admin-page-content">
      <p class="admin-eyebrow">MANAGE YOUR DEWFORD</p>
      <div class="admin-heading"><div><h1 id="admin-board-title">이벤트 게시판</h1><p id="admin-board-description">아이들의 배움과 성장의 순간을 전합니다.</p></div><button id="admin-create" class="admin-primary" type="button">+ 글쓰기</button></div>
      <section class="admin-summary" aria-label="현재 게시판 현황"><div><span>전체 콘텐츠</span><strong id="admin-total">0</strong></div><div><span>공개</span><strong id="admin-published">0</strong></div><div><span>비공개</span><strong id="admin-drafts">0</strong></div></section>
      <section class="admin-content" aria-label="콘텐츠 목록">
        <div class="admin-list-toolbar"><label class="admin-search-wrap">검색<input id="admin-search" type="search" placeholder="제목 검색"></label><span id="admin-count"></span><a id="admin-public-link" href="event.html">게시판 보기 ↗</a></div>
        <p id="admin-status" role="status" aria-live="polite"></p>
        <div id="admin-list" class="admin-list"></div>
      </section>
    </div>
  </main>
</section>
<dialog id="admin-editor" aria-labelledby="admin-editor-title"><form id="admin-edit-form"><div class="admin-dialog-heading"><div><p class="admin-eyebrow">CONTENT EDITOR</p><h2 id="admin-editor-title">글 등록</h2></div><button type="button" data-close-editor aria-label="닫기">×</button></div><input type="hidden" name="id"><div class="admin-editor-layout"><div class="admin-editor-copy"><label>제목<input name="title" required maxlength="200"></label><div data-post-fields><label>날짜<input type="date" name="date"></label><label>목록 소개글<textarea name="excerpt" maxlength="1000" rows="2"></textarea></label><div class="admin-editor-label" id="admin-body-label">내용</div><div id="admin-rich-editor"></div><textarea name="body" hidden></textarea><textarea name="gallery" hidden></textarea><section class="admin-gallery-field" aria-label="추가 이미지"><label>추가 사진 첨부<input type="file" id="admin-gallery-upload" accept="image/png,image/jpeg,image/webp" multiple><small>PNG, JPEG, WebP · 파일당 최대 20MB · 최대 20장 · 자동 용량 최적화</small></label><div id="admin-gallery-preview" class="admin-gallery-preview"></div></section></div></div><div class="admin-editor-media"><p class="admin-eyebrow">IMAGE &amp; DISPLAY</p><h3>이미지 및 노출 설정</h3><input name="image" type="hidden"><label class="admin-image-upload-field">대표 이미지 첨부<input type="file" id="admin-image-upload" accept="image/png,image/jpeg,image/webp"><small>PNG, JPEG, WebP · 최대 20MB · 자동 용량 최적화</small></label><div class="admin-image-preview-wrap"><img id="admin-image-preview" alt="선택한 이미지 미리보기" hidden><button type="button" id="admin-image-remove" hidden>이미지 삭제</button></div><div data-popup-fields hidden><label>이미지 클릭 시 이동할 주소<input name="link" placeholder="https://..."></label><label>PC 팝업 폭 (px)<input name="width" type="number" min="240" max="1000" value="480"></label><div class="admin-field-row"><label>노출 시작 (한국 시간)<input name="startsAt" type="datetime-local"></label><label>노출 종료 (한국 시간)<input name="endsAt" type="datetime-local"></label></div><label class="admin-check"><input name="enabled" type="checkbox" checked>팝업 사용</label></div><label class="admin-check"><input name="published" type="checkbox" checked>공개</label></div></div><p id="admin-editor-status" role="status"></p><div class="admin-dialog-actions"><button type="button" data-close-editor>취소</button><button class="admin-primary" type="submit">저장</button></div></form></dialog>
<dialog id="admin-move" aria-labelledby="admin-move-title"><form id="admin-move-form"><h2 id="admin-move-title">게시글 이동</h2><p>다른 게시판으로 이동합니다. 캘린더에서는 선택한 날짜에 표시됩니다.</p><label>이동할 게시판<select name="target"></select></label><label>날짜<input name="date" type="date" required></label><p id="admin-move-status" role="status"></p><div class="admin-dialog-actions"><button type="button" id="admin-move-cancel">취소</button><button class="admin-primary" type="submit">이동</button></div></form></dialog>
<script src="js/dewford-admin-client.js"></script><script src="js/vendor/quill/quill.js"></script><script src="js/dewford-admin.js"></script>
</body></html>
