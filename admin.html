<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DEWFORD 관리자</title><link rel="icon" href="images/common/symbol_2.png"><link rel="stylesheet" href="css/dewford-admin.css"></head>
<body class="dewford-admin-page">
<header class="admin-header"><a href="index.html">DEWFORD <span>관리자</span></a><div><a href="index.html">홈페이지 보기 ↗</a><button id="admin-logout" hidden>로그아웃</button></div></header>
<main class="admin-main">
<p id="admin-status" role="status" aria-live="polite"></p>
<section id="admin-login-panel" class="admin-login" hidden><h1>관리자 로그인</h1><p>게시판과 홈페이지 팝업을 관리합니다.</p><form id="admin-login-form"><label>아이디<input name="username" autocomplete="username" required maxlength="100"></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="500"></label><button class="admin-primary" type="submit">로그인</button></form></section>
<section id="admin-workspace" hidden>
<div class="admin-heading"><div><p class="admin-eyebrow">CONTENT MANAGEMENT</p><h1>홈페이지 관리</h1></div><button id="admin-create" class="admin-primary">새 글 등록</button></div>
<nav class="admin-tabs" aria-label="관리할 게시판"><button data-board="events">이벤트 게시판</button><button data-board="preschool">유치부 캘린더</button><button data-board="elementary">초등부 캘린더</button><button data-board="popups">팝업 관리</button></nav>
<div class="admin-list-toolbar"><input id="admin-search" type="search" placeholder="제목 검색" aria-label="제목 검색"><span id="admin-count"></span></div>
<div id="admin-list" class="admin-list"></div>
</section>
</main>
<dialog id="admin-editor" aria-labelledby="admin-editor-title"><form id="admin-edit-form"><div class="admin-dialog-heading"><h2 id="admin-editor-title">글 등록</h2><button type="button" data-close-editor aria-label="닫기">×</button></div><input type="hidden" name="id"><label>제목<input name="title" required maxlength="200"></label><div data-post-fields><label>날짜<input type="date" name="date"></label><label>목록 소개글<textarea name="excerpt" maxlength="1000" rows="2"></textarea></label><label>내용<textarea name="body" maxlength="30000" rows="8"></textarea></label><label>추가 이미지 주소 (한 줄에 하나)<textarea name="gallery" rows="3" placeholder="images/sub/example.jpg"></textarea></label></div><label>이미지 주소<input name="image" placeholder="images/sub/pop2026_1.png 또는 https://..."></label><label>이미지 파일 업로드<input type="file" id="admin-image-upload" accept="image/png,image/jpeg,image/webp"><small>PNG, JPEG, WebP · 최대 5MB</small></label><img id="admin-image-preview" alt="선택한 이미지 미리보기" hidden><div data-popup-fields hidden><label>이미지 클릭 시 이동할 주소<input name="link" placeholder="https://..."></label><label>PC 팝업 폭 (px)<input name="width" type="number" min="240" max="1000" value="480"></label><div class="admin-field-row"><label>노출 시작 (한국 시간)<input name="startsAt" type="datetime-local"></label><label>노출 종료 (한국 시간)<input name="endsAt" type="datetime-local"></label></div><label class="admin-check"><input name="enabled" type="checkbox" checked>팝업 사용</label></div><label class="admin-check"><input name="published" type="checkbox" checked>공개</label><p id="admin-editor-status" role="status"></p><div class="admin-dialog-actions"><button type="button" data-close-editor>취소</button><button class="admin-primary" type="submit">저장</button></div></form></dialog>
<dialog id="admin-move" aria-labelledby="admin-move-title"><form id="admin-move-form"><h2 id="admin-move-title">게시글 이동</h2><p>다른 게시판으로 이동합니다. 캘린더에서는 선택한 날짜에 표시됩니다.</p><label>이동할 게시판<select name="target"></select></label><label>날짜<input name="date" type="date" required></label><p id="admin-move-status" role="status"></p><div class="admin-dialog-actions"><button type="button" id="admin-move-cancel">취소</button><button class="admin-primary" type="submit">이동</button></div></form></dialog>
<script src="js/dewford-admin-client.js"></script><script src="js/dewford-admin.js"></script>
</body></html>
