<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>상담 접수 | DEWFORD 관리자</title><link rel="icon" href="images/common/symbol_3.png"><link rel="stylesheet" href="css/dewford-shared-ui.css"><link rel="stylesheet" href="css/vendor/quill.snow.css"><link rel="stylesheet" href="css/dewford-admin.css"></head>
<body class="dewford-admin-page">
<p id="admin-auth-loading" role="status">관리 화면을 불러오고 있습니다.</p>
<section id="admin-workspace" class="admin-workspace" hidden>
  <aside class="admin-sidebar">
    <a class="admin-brand" href="admin.html"><img src="images/dewford/logo-sharp-white.svg" alt="DEWFORD INTERNATIONAL COLLEGE" width="316" height="75"></a>
    <p class="admin-nav-label">WORKSPACE</p>
    <nav class="admin-tabs" aria-label="관리할 게시판">
      <a class="admin-inquiries-link" href="admin.html?board=events"><span>이벤트 게시판</span><span aria-hidden="true">↗</span></a>
      <a class="admin-inquiries-link" href="admin.html?board=preschool"><span>유치부 캘린더</span><span aria-hidden="true">↗</span></a>
      <a class="admin-inquiries-link" href="admin.html?board=elementary"><span>초등부 캘린더</span><span aria-hidden="true">↗</span></a>
      <a class="admin-inquiries-link" href="admin.html?board=popups"><span>팝업 관리</span><span aria-hidden="true">↗</span></a>
      <a class="admin-inquiries-link" href="admin-inquiries.html" aria-current="page"><span>상담 접수</span><span aria-hidden="true">↗</span></a>
      <a class="admin-inquiries-link" href="admin-tuition.html"><span>교습비 관리</span><span aria-hidden="true">↗</span></a>
      <a class="admin-inquiries-link" href="admin-settings.html"><span>공통 정보 관리</span><span aria-hidden="true">↗</span></a>
      <a class="admin-inquiries-link" href="admin-guide.html" target="_blank" rel="noopener noreferrer"><span>운영 가이드</span><span aria-hidden="true">↗</span></a>
    </nav>
    <div class="admin-sidebar-bottom"><a href="index.html">홈페이지 보기 ↗</a><button id="admin-logout" type="button">로그아웃</button></div>
  </aside>
  <main class="admin-main">
    <header class="admin-topbar"><span>DEWFORD / ADMIN</span><span>홈페이지 관리</span></header>
    <div class="admin-page-content">
      <p class="admin-eyebrow">MANAGE YOUR DEWFORD</p>
      <div class="admin-heading"><div><h1 id="admin-board-title">상담 접수</h1><p id="admin-board-description">홈페이지에서 접수된 상담 신청을 최신순으로 확인합니다.</p></div><button id="inquiry-refresh" class="admin-primary" type="button">새로고침</button></div>
      <section class="admin-content" aria-label="상담 접수 목록">
        <div class="admin-list-toolbar"><form id="inquiry-search-form" class="inquiry-search-form"><label class="admin-search-wrap">검색<input id="admin-search" type="search" maxlength="100" placeholder="성함, 연락처, 과정, 상담 내용"></label><button type="submit">검색</button></form><span id="admin-count"></span></div>
        <div class="inquiry-controls">
<input id="inquiry-select-all" type="checkbox" aria-label="현재 페이지 전체 선택">
<div class="inquiry-status-control" role="group" aria-label="선택한 상담 상태 변경"><select id="inquiry-bulk-status" aria-label="변경할 상담 상태"></select><button id="inquiry-selected-status" type="button" disabled>상태 일괄 변경</button></div><button id="inquiry-selected-delete" type="button" disabled>일괄 삭제</button><button id="inquiry-export" type="button">엑셀 다운로드</button>
</div><p id="admin-status" role="status" aria-live="polite"></p>
        <div id="admin-list" class="admin-list"></div><div class="inquiry-pagination"><button id="inquiry-prev" type="button">이전</button><span id="inquiry-page"></span><button id="inquiry-next" type="button">다음</button></div>
      </section>
    </div>
  </main>
</section>
<dialog id="inquiry-detail" aria-labelledby="inquiry-detail-title"><div class="admin-dialog-heading"><h2 id="inquiry-detail-title">상담 신청 상세</h2><button id="inquiry-close" type="button" aria-label="닫기">×</button></div><dl id="inquiry-fields" class="inquiry-fields"></dl><p id="inquiry-detail-status" role="status"></p><div class="admin-dialog-actions"><label>상담 단계 <select id="inquiry-detail-stage"></select></label><button id="inquiry-detail-save" type="button">상태 변경</button></div></dialog>
<script src="js/dewford-admin-client.js"></script><script src="js/dewford-admin-inquiries.js"></script></body></html>
